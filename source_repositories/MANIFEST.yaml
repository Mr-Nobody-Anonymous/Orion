  adapter: ORION wraps the upstream via a stable ORION-owned interface
  sidecar: upstream runs as an isolated process/service; ORION talks via IPC
  reference: read-only study surface; no code copied into ORION
  benchmark: candidate pool for evaluation/benchmarking only
  conceptual: ideas are absorbed into ORION design; no code reuse
  research: experimental components; not on the production path
  optional: exposed through a provider interface; safe to skip
  fallback: alternative implementation behind a stable interface
  deprecated: historical reference; not promoted to a dependency
  excluded: kept for provenance; explicitly NOT on the ORION path
  isolated: out of current asset scope; preserved untouched
