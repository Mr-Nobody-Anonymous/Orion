name: Backtest Engine

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "Strategy identifier to backtest"
        required: true
        default: "ensemble_trend"
      symbol:
        description: "Asset symbol"
        required: true
        default: "SPY"
      start_date:
        description: "Start Date (YYYY-MM-DD)"
        required: false
        default: "2023-01-01"
      end_date:
        description: "End Date (YYYY-MM-DD)"
        required: false
        default: "2024-01-01"

jobs:
  run-backtest:
    name: Run Backtest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Backtest Simulation
        run: |
          python start.py --check
          echo "Executing simulation backtest for ${{ github.event.inputs.strategy }} on ${{ github.event.inputs.symbol }}"
