name: Model Training Pipeline

on:
  workflow_dispatch:
    inputs:
      model_type:
        description: "Model architecture (e.g., lstm, transformer, xgboost)"
        required: true
        default: "transformer"
      epochs:
        description: "Number of training epochs"
        required: false
        default: "10"

jobs:
  train-model:
    name: Model Training
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Model Configuration
        run: |
          python -c "import orion; print('Orion initialized successfully for model training pipeline')"
