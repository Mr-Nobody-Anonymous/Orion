version: '3.8'

services:
  core-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.core
    ports:
      - "8000:8000"
    environment:
      - ORION_ENV=development
      - ORION_LIVE_TRADING_ENABLED=false
      - ORION_API_KEY=orion_dev_key_change_in_production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ui
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://core-api:8000
    depends_on:
      - core-api
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
