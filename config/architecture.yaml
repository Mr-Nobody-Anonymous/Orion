# ORION — Machine-Readable Architecture Specification
#
# This is the authoritative source of truth for ORION's component graph,
# boundaries, providers, and policies. The runtime should be able to
# validate configuration against this file. Generated by
# `tools/validate_architecture.py` which cross-checks that the
# `src/orion/` tree implements the components listed here.
#
# Source of truth: docs/architecture/SYSTEM_OVERVIEW.md,
# ORION_ARCHITECTURE_AUDIT.md, and the existing ORION implementation.

version: 1

# --------------------------------------------------------------------------- identity
identity:
  name: orion
  description: >-
    Hardware-adaptive, asset-class-agnostic, audit-friendly AI/quant
    research and trading platform. The LLM is an augmentation layer;
    the system itself is the intelligence.
  canonical_package: src/orion
  external_ecosystem: source_repositories
  provenance_manifest: source_repositories/MANIFEST.yaml

# --------------------------------------------------------------------------- core
# The ORION-owned abstractions every other component plugs into.
core_interfaces:
  - Asset
  - MarketDataProvider
  - FeatureProvider
  - ForecastModel
  - PredictionModel
  - AIProvider
  - Agent
  - MemoryStore
  - WorldModel
  - Strategy
  - Portfolio
  - RiskEngine
  - BrokerAdapter
  - ExecutionEngine
  - BacktestEngine
  - EvaluationEngine
  - ExperimentTracker
  - StrategyRegistry
  - DatasetRegistry
  - ModelRegistry

# --------------------------------------------------------------------------- components
# Each component is a node in the architecture graph. Path is the canonical
# ORION module path; integrations declares how external systems plug in.
components:

  brain:
    description: 16-phase executive cognitive loop
    path: src/orion/brain
    depends_on: [world_model, memory, research, prediction, risk, execution, learning]
    entrypoints:
      - orion.brain.orchestrator.ExecutiveOrchestrator
      - orion.brain.executive.ExecutiveCoordinator

  data:
    description: Typed contracts and validation
    path: src/orion/data
    depends_on: []
    entrypoints:
      - orion.data.contracts.Asset
      - orion.data.contracts.MarketData
      - orion.data.contracts.MarketQuote
      - orion.data.contracts.OHLCV

  market_data_layer:
    description: Point-in-time data with vendor release timestamps
    path: src/orion/data/market_data
    depends_on: [data]
    entrypoints:
      - orion.data.market_data.pit.PointInTimeDataset
      - orion.data.market_data.provider.MarketDataProvider
      - orion.data.market_data.versioning.LocalMarketDataStore

  providers:
    description: External data connectors (crypto, filings, news, etc.)
    path: src/orion/data/providers
    depends_on: [data, market_data_layer]

  intelligence:
    description: LLM layer + financial reasoning + sentiment + tool registry
    path: src/orion/intelligence
    depends_on: [agents]
    entrypoints:
      - orion.intelligence.llm.providers.LLMProvider
      - orion.intelligence.financial_reasoning.reasoner.FinancialReasoner

  models:
    description: Model routing + local/cloud providers + registry
    path: src/orion/models
    depends_on: [infrastructure]
    entrypoints:
      - orion.models.local.ollama.OllamaProvider
      - orion.models.cloud.provider.NullCloudProvider
      - orion.models.routing.router.HardwareProfile

  prediction:
    description: Forecasting + ensembles + calibration
    path: src/orion/prediction
    depends_on: [data, agents]

  research:
    description: Autonomous research with provenance (OpenAlex + structured extraction)
    path: src/orion/research
    depends_on: [intelligence, memory, prediction]
    policy: external text is data, never instructions

  memory:
    description: 7-layer bounded memory
    path: src/orion/memory
    depends_on: [data]

  world_model:
    description: 9 state objects with KnowledgeStatus
    path: src/orion/world_model
    depends_on: [data]

  evolution:
    description: Candidate-strategy evolution (candidates only — never promotes)
    path: src/orion/evolution
    depends_on: [prediction, backtesting]

  simulation:
    description: Event-driven matching + account + venue
    path: src/orion/simulation
    depends_on: [data]

  backtesting:
    description: Backtest engines with contamination-safe splits
    path: src/orion/backtesting
    depends_on: [data, simulation]

  evaluation:
    description: Walk-forward OOS, regime, cost-aware evaluation lab
    path: src/orion/evaluation
    depends_on: [prediction, backtesting]

  benchmarking:
    description: Cross-model walk-forward comparison
    path: src/orion/benchmarking
    depends_on: [prediction, evaluation]

  learning:
    description: Continual learning + promotion gate
    path: src/orion/learning
    depends_on: [evaluation, evolution]
    policy: deny-by-default promotion

  trading:
    description: BrokerAdapter + risk + execution + strategies + portfolio
    path: src/orion/trading
    depends_on: [risk, simulation]
    entrypoints:
      - orion.trading.execution.SimulatedBroker
      - orion.trading.risk.RiskEngine

  risk:
    description: Deterministic risk gate — language-model-independent
    path: src/orion/trading/risk.py
    policy: enforces order-notional / exposure / correlation / kill-switch

  execution:
    description: Broker adapters
    path: src/orion/trading/brokers
    integrations:
      - adapter: SimulatedExchangeBroker
        path: src/orion/simulation/exchange
        status: primary
      - adapter: AlpacaAdapter
        path: src/orion/integrations/brokers
        status: blocked_by_default
    policy: live_execution_disabled_by_default

  infrastructure:
    description: Configuration, event bus, hardware profiler, governance, provenance
    path: src/orion/infrastructure

  agents:
    description: Multi-agent hierarchy (controller enforces Compliance > Risk > Decision > others)
    path: src/orion/agents
    policy: every agent has clear responsibility, inputs, outputs, permissions, evaluation

  coding:
    description: Sandboxed code generation, verification, debugging, patching
    path: src/orion/coding
    policy: sandboxed subprocess; network disabled by default

  storage:
    description: SQLite + parquet opt-in persistent store
    path: src/orion/storage

  ops:
    description: Metrics, tracing, health, alerts
    path: src/orion/ops

  security:
    description: Secret isolation, prompt guard, audit log
    path: src/orion/security
    policy: external text is data, not instructions

  compliance:
    description: Audit log, RBAC, restricted list, best execution
    path: src/orion/compliance

  dashboard:
    description: Text + FastAPI operator surfaces
    path: src/orion/dashboard

  distributed:
    description: Local queue, worker pools, OrionController
    path: src/orion/distributed

  portfolio:
    description: Allocator, constructor, factors, optimizer
    path: src/orion/portfolio

  markets:
    description: Asset-class specialists (equities, etf, crypto, futures, fx, commodities, fixed_income, options, prediction_markets)
    path: src/orion/markets

  mathematics:
    description: Pricing, derivatives, probability, risk math, statistics, optimization
    path: src/orion/mathematics

  cli:
    description: Command-line interface
    path: src/orion/cli
    entrypoints:
      - orion.cli.main

  orchestration:
    description: Composition root — OrionSystem wires every component
    path: src/orion/orchestration
    entrypoints:
      - orion.orchestration.system.OrionSystem

# --------------------------------------------------------------------------- providers
# AIProvider implementations the LLM layer can dispatch through.
ai_providers:
  - name: OllamaProvider
    path: src/orion/models/local/ollama.py
    transport: http
    endpoint: http://localhost:11434
    status: primary
    default_model: qwen2.5:7b
  - name: NullCloudProvider
    path: src/orion/models/cloud/provider.py
    transport: stub
    status: blocked
    note: raises CloudProviderUnavailable unless explicitly configured
  - name: OpenAIProvider
    path: src/orion/models/cloud/openai.py
    transport: http
    status: planned
  - name: AnthropicProvider
    path: src/orion/models/cloud/anthropic.py
    transport: http
    status: planned
  - name: AzureOpenAIProvider
    path: src/orion/models/cloud/azure_openai.py
    transport: http
    status: planned
  - name: HttpProvider
    path: src/orion/models/cloud/http.py
    transport: http
    status: planned

# --------------------------------------------------------------------------- asset classes
asset_classes:
  enabled:
    - EQUITY
    - ETF
  architecture_supports:
    - EQUITY
    - ETF
    - CRYPTO
    - FUTURE
    - COMMODITY
    - FOREX
    - FIXED_INCOME
    - OPTION
    - PREDICTION_MARKET

# --------------------------------------------------------------------------- execution modes
execution_modes:
  - name: simulation
    description: Event-driven simulated exchange with realistic fills
    default: true
  - name: paper
    description: Real broker paper endpoint (e.g. Alpaca paper)
    default: false
  - name: live
    description: Real broker live endpoint — blocked by default
    default: false
    blocked_by_default: true

# --------------------------------------------------------------------------- autonomy levels
autonomy_levels:
  - level: 0
    name: research_only
    description: No actions; produce reports and recommendations only
    default: true
  - level: 1
    name: recommendations
    description: Produce actionable recommendations; human decides
  - level: 2
    name: paper
    description: Paper trading with risk gates
  - level: 3
    name: limited_autonomous
    description: Autonomous under strict risk controls
  - level: 4
    name: autonomous
    description: Full autonomy — requires explicit multi-step approval

# --------------------------------------------------------------------------- model tiers
model_tiers:
  - tier: tiny
    vram_gb_max: 4
    use_cases: [classification, simple_routing, sentiment]
  - tier: small
    vram_gb_max: 8
    use_cases: [extraction, summarization]
  - tier: medium
    vram_gb_max: 16
    use_cases: [reasoning, planning, research_synthesis]
  - tier: large
    vram_gb_max: 32
    use_cases: [complex_strategy_design]
  - tier: xlarge
    vram_gb_max: null
    use_cases: [frontier_research]

# --------------------------------------------------------------------------- security policies
security_policies:
  secrets:
    - store: os_keyring
    - store: env
    - forbid: hardcoded_in_source
    - forbid: in_prompts_to_llm
  prompt_injection:
    - external_text_is_data
    - never_treat_external_text_as_instructions
  execution:
    - signed_orders_only: true
    - risk_engine_authorization_required: true
    - kill_switch: required
  dependencies:
    - pinned_versions: true
    - pip_audit: required
    - license_tracking: required

# --------------------------------------------------------------------------- repository integration modes
# (mirrors source_repositories/MANIFEST.yaml — kept in sync by validate script)
repository_integration_modes:
  - dependency
  - adapter
  - sidecar
  - reference
  - benchmark
  - conceptual
  - research
  - optional
  - fallback
  - deprecated
  - excluded
  - isolated

# --------------------------------------------------------------------------- intelligence principle
intelligence_principle:
  rule: >-
    Use the cheapest appropriate intelligence for each task. Combine
    symbolic logic, deterministic computation, statistical models, ML,
    time-series models, RL, LLM reasoning, memory, world state, tools,
    simulation, evaluation, self-critique, and strategy evolution.
  examples:
    - "simple_calculation -> deterministic code"
    - "database_lookup -> database"
    - "parameter_sweep -> vectorized engine"
    - "forecast -> forecasting model"
    - "risk_calculation -> deterministic risk engine"
    - "document_classification -> small model"
    - "research_synthesis -> stronger LLM"
    - "strategy_proposal -> multi-component reasoning"
    - "strategy_validation -> simulation + statistical tests"

# --------------------------------------------------------------------------- cloud / local / hybrid
deployment_modes:
  local:
    description: All intelligence and execution local
    providers: [OllamaProvider]
  hybrid:
    description: Cloud produces candidates; local validates; local executes
    providers: [OllamaProvider, OpenAIProvider, AnthropicProvider]
    rule: cloud_never_directly_drives_execution
  cloud:
    description: Cloud-heavy; always validated locally before any execution
    providers: [OllamaProvider, OpenAIProvider, AnthropicProvider, AzureOpenAIProvider]
    default: blocked

# --------------------------------------------------------------------------- governance
governance:
  promotion_gate: deny_by_default
  audit_log: append_only
  approval_required_at_autonomy: 3
  live_trading:
    require_explicit_enable: true
    require_environment: live
    require_audit: true

# --------------------------------------------------------------------------- planes
# The Intelligence / Truth / Control / Capital dependency direction is the
# single most important architectural rule in ORION. It is enforced
# mechanically by ``tools/enforce_planes.py`` and the
# ``tests/architecture/test_plane_separation.py`` test suite.
#
# Dependency direction:
#
#     INTELLIGENCE  ->  TRUTH  ->  CONTROL  ->  CAPITAL
#
# Intelligence must never import control. Control must never import
# intelligence. Truth must not bypass control. Only the executive
# brain (``brain.orchestrator`` and ``brain.executive``) is allowed
# to bridge intelligence -> control; that bridge is the single
# audited seam through which a decision reaches a broker.
planes:
  intelligence:
    description: Creative, candidate-producing modules
    members:
      - intelligence
      - agents
      - brain
      - research
      - evolution
      - hypothesis
      - memory
      - coding
      - learning
      - prediction
    may_import_from: [truth, foundation]
    may_not_import_from: [control]
  truth:
    description: Validates whether a candidate is actually true
    members:
      - data.contracts
      - data.market_data
      - data.validation
      - data.providers
      - evaluation
      - benchmarking
      - backtesting
      - world_model
      - simulation
      - portfolio
      - markets
      - mathematics
      - orchestration
      - trading
    may_import_from: [foundation]
    may_not_import_from: [control]
  control:
    description: Affects money or system integrity
    members:
      - trading.execution
      - trading.risk
      - integrations.brokers
      - security
      - compliance
      - dashboard
      - ops
    may_import_from: [truth, foundation]
    may_not_import_from: [intelligence]
  foundation:
    description: Cross-cutting, neutral; not a plane
    members:
      - models
      - infrastructure
      - storage
      - distributed
      - cli
    may_import_from: []
    may_not_import_from: []
  bridge:
    description: >
      The single allowed intelligence -> control seam. Only the
      executive brain may reach across it, and only because it is
      the orchestrator that sequences the cognitive loop.
    members:
      - brain.orchestrator
      - brain.executive
    may_import_from: [truth, foundation, control]
    may_not_import_from: []
  enforcement:
    tool: tools/enforce_planes.py
    test: tests/architecture/test_plane_separation.py
    rule_summary: >
      A module in the intelligence plane may not import from the
      control plane. A module in the control plane may not import
      from the intelligence plane. The only allowed intelligence
      -> control bridge is brain.orchestrator and brain.executive.
