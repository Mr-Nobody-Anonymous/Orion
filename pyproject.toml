[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion"
version = "0.1.0"
description = "ORION financial intelligence platform"
readme = "README.md"
license = "MIT"
authors = [{ name = "ORION contributors" }]
keywords = ["finance", "research", "trading", "risk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    # All ORION stdlib-only modules work without any of these; the
    # packages below are optional integrations that enhance the
    # system when present. ``provider.status()`` reports whether each
    # is available.
    "requests>=2.28",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "numpy>=1.23",
    "pydantic>=2.0.0",
]
ml = [
    "numpy>=1.23",
    "scikit-learn>=1.0",
    "torch>=2.0",
]
data = [
    "ccxt>=4.0",
    "alpaca-py>=0.30",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
]
dev = [
    "wheel",
    "build",
    "pytest>=7",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib"

[project.scripts]
orion = "orion.__main__:main"

[project.urls]
Homepage = "https://github.com/Mr-Nobody-Anonymous/Orion"
Repository = "https://github.com/Mr-Nobody-Anonymous/Orion"
Issues = "https://github.com/Mr-Nobody-Anonymous/Orion/issues"

[tool.setuptools.packages.find]
where = ["src"]
