# ORION Model Training and Inference Configuration
models:
  trend_follower:
    type: "ensemble_trend"
    lookback_window: 25
    momentum_threshold: 0.02
  regime_classifier:
    type: "volatility_regime"
    history_days: 60
    regimes: ["low_vol_bull", "high_vol_bull", "high_vol_bear", "range_bound"]
  inference:
    device: "cpu"  # cpu | cuda
    batch_size: 32
    max_latency_ms: 50.0
